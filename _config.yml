# Shared image configuration for both ImgFlow and Picture Tag
# Only `originals` and `output` are required — all other values have
# sensible defaults built into the ImgFlow Config class.
shared_images_configs:
  # Input sources (original images)
  originals: "assets/images/originals"

  # Output destination (optimized images)
  output: "assets/images/optimized"

  # Standardized formats for both plugins (optional — defaults built in)
  input_formats:
    - jpg
    - jpeg
    - png
    - webp
    - avif
    - gif
    - tiff
    - tif
    - svg
  formats:
    - avif
    - webp
    - png
    - jpg

  # Standardized sizes for both plugins (optional — defaults built in)
  sizes:
    sm: 400
    md: 800
    lg: 1200
    xl: 2000

# ImgFlow configuration
# Minimal config: just add `imgflow:` and override what you need.
# Defaults: quality=85, backend_priority ordered by speed (see docs/providers.md)
#
#   imgflow:
#     originals: "assets/images/originals"  # optional (default shown)
#     output: "assets/images/optimized"     # optional (default shown)
#
imgflow:
  quality: 85
  # Backend priority ordered by benchmark speed (fastest first):
  # sharp (14s) → libvips (22s) → imagemagick (31s) → imgproxy (31s) → weserv (30s) → flyimg
  backend_priority:
    - sharp
    - libvips
    - imagemagick
    - imgproxy
    - weserv
    - flyimg
  # Format used for the <img> fallback in <picture> elements.
  # All other formats get <source> tags for browsers that support them.
  # Default: jpg (change to png if you need transparency in the fallback)
  fallback_format: jpg
  # HTTP provider URLs (only needed if using those providers)
  imgproxy_url: "http://192.168.1.50:8080"
  sharp_url: "http://192.168.1.51:3000"

# jekyll_picture_tag configuration
picture:
  # Use same source as ImgFlow originals for alignment
  source: "assets/images/originals"
  # Use same output as ImgFlow for alignment
  output: "assets/images/optimized"
  # Enable Picture Tag to work with ImgFlow
  disabled: true
  # Ignore missing images to avoid errors
  # ignore_missing_images: true
  presets:
    default:
      formats:
        - webp
        - avif
        - jpg
        - png
      widths:
        - 400
        - 800
        - 1200
        - 2000
