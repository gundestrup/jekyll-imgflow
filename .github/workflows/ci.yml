name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        ruby: ["3.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install image processing libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev imagemagick \
            libheif-plugin-aomenc libheif-plugin-aomdec libheif-plugin-libde265

      - name: Install Sharp CLI
        run: npm install -g sharp-cli@5.2.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec --format progress --tag ~slow
        env:
          CI: "true"

      - name: Run RuboCop
        run: bundle exec rubocop
