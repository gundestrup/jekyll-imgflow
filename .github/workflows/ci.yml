name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install image processing libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev imagemagick \
            libheif-plugin-aomenc libheif-plugin-aomdec libheif-plugin-libde265

      - name: Install Sharp CLI
        run: |
          SHARP_CLI_VERSION="$(node -p "require('./package.json').devDependencies['sharp-cli']")"
          npm install -g "sharp-cli@${SHARP_CLI_VERSION}"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec --format progress --tag ~slow
        env:
          CI: "true"

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Install Semgrep
        run: pip3 install --only-binary :all: "semgrep==1.177.0"

      - name: Run Semgrep security scan
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: semgrep ci
