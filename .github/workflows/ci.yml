name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            AGENTS.md
            [Cc][Hh][Aa][Nn][Gg][Ee][Ll][Oo][Gg].md
            CLAUDE.md
            CONTRIBUTING.md
            DEVIN.md
            DOCUMENTATION.md
            [Rr][Ee][Aa][Dd][Mm][Ee].md
            README.Development.md
            README.developer.md
            README.performance.md
            README.devel*.md
            RELEASE.md
            SECURITY.md
            STYLING.md
            TESTING.md
            WINDSURF.md
            .devin/*.md
            .github/**/*.md
      - name: Audit dev dependencies
        run: npm ci --ignore-scripts && npm run audit

  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install image processing libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev imagemagick \
            libheif-plugin-aomenc libheif-plugin-aomdec libheif-plugin-libde265

      - name: Install Sharp CLI
        run: |
          SHARP_CLI_VERSION="$(node -p "require('./package.json').devDependencies['sharp-cli']")"
          npm install -g "sharp-cli@${SHARP_CLI_VERSION}"

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec --format progress --tag ~slow
        env:
          CI: "true"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/coverage.xml
          use_oidc: true
          fail_ci_if_error: true

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Run RuboCop
        run: bundle exec rubocop

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Semgrep security scan
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: semgrep ci
