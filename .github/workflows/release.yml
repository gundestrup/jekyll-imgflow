name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.221.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build gem
        run: gem build jekyll-imgflow.gemspec

      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1
