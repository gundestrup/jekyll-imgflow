# SonarQube Cloud configuration (CI-based analysis via GitHub Actions).
sonar.organization=gundestrup
sonar.projectKey=gundestrup_jekyll-imgflow
sonar.projectName=jekyll-imgflow

sonar.sources=.
sonar.test.inclusions=spec/**
sonar.exclusions=coverage/**,vendor/**,pkg/**

# SimpleCov JSON report emitted by spec/spec_helper.rb in CI
sonar.ruby.coverage.reportPaths=coverage/coverage.json

# Dev/test tooling under scripts/ and the bin/ parallel test runner have no
# instrumentation, so exclude them from the coverage denominator.
sonar.coverage.exclusions=scripts/**,bin/parallel_provider_tests.rb
